name: Publish Flightdeck to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check JavaScript and run tests
        run: |
          node --check app.js
          node --check data.js
          node --check lessons.js
          node --check study.js
          node --check study-core.js
          node --check phak.js
          node --check phak-summary.js
          for file in phak-ch*.js; do node --check "$file"; done
          node --check caa.js
          node --check caa-ui.js
          node --check caa-state.js
          for file in caa-*-questions.js; do node --check "$file"; done
          node --check caa-ppl.js
          node --check caa-cpl.js
          node --check caa-atpl.js
          npm test
      - name: Prepare public website files
        run: |
          mkdir -p _site
          cp index.html style.css app.js data.js lessons.js study.js study-core.js phak.js phak-summary.js phak-ch*.js caa.js caa-ui.js caa-state.js caa-*-questions.js caa-ppl.js caa-cpl.js caa-atpl.js _site/
          cp -R assets _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
